replicaCount: 2

image:
  repository: busybox
  tag: "1.37.0-musl"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

persistence:
  enabled: true
  storageClass: longhorn-retain
  size: 1Gi

podDisruptionBudget:
  minAvailable: 1

nodeSelector:
  node-type: worker

tolerations: []
affinity: {}
