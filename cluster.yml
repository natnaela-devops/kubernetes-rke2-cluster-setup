# cluster.yml - Sample Rancher RKE2 Cluster Configuration
# Used for production-grade setups in banking and health systems

apiVersion: rke2.cattle.io/v1
kind: RKE2Cluster
metadata:
  name: production-cluster
  namespace: default
spec:
  kubernetesVersion: v1.28.0+rke2r1   # Update to latest stable version as needed
  nodes:
    - address: 192.168.10.10
      user: ubuntu
      role:
        - controlplane
        - etcd
      sshKeyPath: ~/.ssh/id_rsa
    - address: 192.168.10.11
      user: ubuntu
      role:
        - worker
    - address: 192.168.10.12
      user: ubuntu
      role:
        - worker

  # Cluster networking
  cluster-cidr: 10.42.0.0/16
  service-cidr: 10.43.0.0/16
  cluster-dns: 10.43.0.10

  # Security & TLS
  tls-san:
    - "k8s.example.com"
    - "192.168.10.10"

  # Node labels & taints (common in production)
  node-label:
    - "environment=production"
    - "workload=banking-health"
  node-taint: []

  # Enable Longhorn-friendly settings
  rke2Config:
    disable: []
    write-kubeconfig-mode: "0644"
    debug: false
